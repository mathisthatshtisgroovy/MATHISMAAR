<div class="nav-container">

  <button class="mobile-menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu"></button>

  <div class="menu-items" aria-label="Primary">
    <a href="/#works">Works</a>
    <a href="/info">Info</a>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <a href="/#works">Works</a>
    <a href="/info">Info</a>
    <a href="/archive">Archive</a>
  </div>
</div>
<script>
(function(){
  var nav = document.currentScript.previousElementSibling.parentElement || document.querySelector(".nav-container");
  var btn = document.querySelector(".mobile-menu-toggle");
  var panel = document.getElementById("mobile-menu");
  if (!btn || !panel) return;

  function closeMenu() {
    btn.setAttribute("aria-expanded", "false");
    panel.setAttribute("aria-hidden", "true");
    document.body.classList.remove("menu-open");
  }

  btn.addEventListener("click", function () {
    var open = btn.getAttribute("aria-expanded") === "true";
    if (open) closeMenu();
    else {
      btn.setAttribute("aria-expanded", "true");
      panel.setAttribute("aria-hidden", "false");
      document.body.classList.add("menu-open");
    }
  });

  panel.addEventListener("click", function (e) {
    if (e.target && e.target.tagName === "A") closeMenu();
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenu();
  });
})();
</script>
