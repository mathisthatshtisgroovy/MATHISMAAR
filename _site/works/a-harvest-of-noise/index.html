<script>
(function(){
  var nav = document.currentScript.previousElementSibling.parentElement || document.querySelector(".nav-container");
  var btn = document.querySelector(".mobile-menu-toggle");
  var panel = document.getElementById("mobile-menu");
  if (!btn || !panel) return;

  function closeMenu() {
    btn.setAttribute("aria-expanded", "false");
    panel.setAttribute("aria-hidden", "true");
    document.body.classList.remove("menu-open");
  }

  btn.addEventListener("click", function () {
    var open = btn.getAttribute("aria-expanded") === "true";
    if (open) closeMenu();
    else {
      btn.setAttribute("aria-expanded", "true");
      panel.setAttribute("aria-hidden", "false");
      document.body.classList.add("menu-open");
    }
  });

  panel.addEventListener("click", function (e) {
    if (e.target && e.target.tagName === "A") closeMenu();
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenu();
  });
})();
</script>

document.getElementById("archive-button").onclick = ()=> toggleDarkMode();

// pages with a full-bleed photo hero (home, worksingle) force the nav
// white for legibility over the image; once scrolled past it into the
// plain --bg content below, .past-hero hands the nav back to the normal
// theme-aware color (see new.css / work-single.css)
(function () {
  function update() {
    document.body.classList.toggle("past-hero", window.scrollY > window.innerHeight * 0.8);
  }
  update();
  window.addEventListener("scroll", update, { passive: true });
})();

// sequence videos are silent animations: don't fetch them until they're near
// the viewport, play while on screen, pause once past. keeps a 27MB file off
// the initial load.
(function () {
  var vids = document.querySelectorAll(".wb-shot video");
  if (!vids.length || !("IntersectionObserver" in window)) return;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var v = e.target;
      if (e.isIntersecting) {
        if (v.preload === "none") v.preload = "auto";
        v.play().catch(function () {});
      } else {
        v.pause();
      }
    });
  }, { rootMargin: "200px" });
  vids.forEach(function (v) { io.observe(v); });
})();
</script>
