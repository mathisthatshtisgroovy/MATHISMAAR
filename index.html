<!DOCTYPE html>
<html lang="en">
<head>
<script>
  window.ASSET_BASE = "https://mathismaar.b-cdn.net";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return window.ASSET_BASE + "/" + u.replace(/^\/+/, "");
  };

  // ✅ make sure `assetUrl(...)` exists as a global name too
  var assetUrl = window.assetUrl;
</script>


<meta charset="UTF-8">
<title>Mathis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="archive.css">
<link rel="stylesheet" href="home.css">
</head>

<body data-page="home" class="transparent-bg">
 <div id="nav"></div>

  <script>
  fetch("nav.html")
    .then(r => r.text())
    .then(d => {
      nav.innerHTML = d;

      const btn = nav.querySelector(".mobile-menu-toggle");
      const panel = nav.querySelector("#mobile-menu");
      if (!btn || !panel) return;

      function closeMenu() {
        btn.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
      }

      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        if (open) closeMenu();
        else {
          btn.setAttribute("aria-expanded", "true");
          panel.setAttribute("aria-hidden", "false");
          document.body.classList.add("menu-open");
        }
      });

      panel.addEventListener("click", (e) => {
        if (e.target && e.target.tagName === "A") closeMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    });
</script>





<!-- HERO IMAGE -->
<div id="hero" class="hero"></div>

<div class="archive-button" id="archive-button"></div>

<!-- SOUND UI -->
<div class="now-playing-wrap">
    <div id="skip-sound" class="skip-sound-btn"></div>
    <div id="now-playing" class="now-playing-text">Now Playing: —</div>
    <div id="skip-notice" class="skip-notice">skipped</div>
</div>


<!-- SCROLL reveals teaser -->
<div class="scroll-indicator">scroll ↓</div>

<section class="teaser">
  <video id="teaserVideo" autoplay muted loop playsinline></video>

<script>
  document.getElementById("teaserVideo").src = assetUrl("assets/home/teaser.mp4");
</script>

</section>

<script src="sound.js"></script>
<script src="transition.js"></script>

<script>
  // HERO BACKGROUND ROTATION
  const heroImages = ["hero1.webp","hero2.webp","hero3.webp"];
  const hero = document.getElementById("hero");

  // Load one random hero on page load
  function loadHero() {
    const img = heroImages[Math.floor(Math.random() * heroImages.length)];
    hero.style.backgroundImage = `url('${assetUrl(`assets/home/${img}`)}')`;
  }

  loadHero();

  // 1) Ensure audio only activates when warm mode toggles
  document.getElementById("archive-button").onclick = () => {
    document.body.classList.toggle("theme-warm");
    handleSoundState(); // starts audio
  };

  // 2) Skip button on home
  document.getElementById("skip-sound").onclick = () => skipTrack();

  // 3) When page loads, if warm mode was active → resume sound
  window.addEventListener("load", () => {
    if (document.body.classList.contains("theme-warm")) handleSoundState();
  });
</script>


</body>
</html>
