<!DOCTYPE html>
<html lang="en">
<head>
<script>
  window.ASSET_BASE = "https://mathismaar.b-cdn.net";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return window.ASSET_BASE + "/" + u.replace(/^\/+/, "");
  };

  var assetUrl = window.assetUrl;
</script>


<meta charset="UTF-8">
<title>Mathis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/global.css?v=20260813-12">
<link rel="stylesheet" href="/archive.css?v=20260813-12">
<link rel="stylesheet" href="/home.css?v=20260813-12">
</head>

<body data-page="home" class="transparent-bg">
<script>if(localStorage.getItem("mm-dark-mode")==="1")document.body.classList.add("dark-mode");</script>
 <div id="nav"></div>

  <script>
  fetch("/nav.html")
    .then(r => r.text())
    .then(d => {
      nav.innerHTML = d;

      const btn = nav.querySelector(".mobile-menu-toggle");
      const panel = nav.querySelector("#mobile-menu");
      if (!btn || !panel) return;

      function closeMenu() {
        btn.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
      }

      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        if (open) closeMenu();
        else {
          btn.setAttribute("aria-expanded", "true");
          panel.setAttribute("aria-hidden", "false");
          document.body.classList.add("menu-open");
        }
      });

      panel.addEventListener("click", (e) => {
        if (e.target && e.target.tagName === "A") closeMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    });
</script>


<div id="hero" class="hero"></div>
<div class="archive-button" id="archive-button"></div>

<div class="now-playing-wrap">
    <div id="skip-sound" class="skip-sound-btn"></div>
    <div id="now-playing" class="now-playing-text">Now Playing: —</div>
    <div id="skip-notice" class="skip-notice">skipped</div>
</div>

<div class="scroll-indicator">scroll ↓</div>

<section class="teaser">
  <video id="teaserVideo" autoplay muted loop playsinline></video>

<script>
  document.getElementById("teaserVideo").src = assetUrl("assets/home/teaser.mp4");
</script>

</section>

<script src="/sound.js?v=20260813-12"></script>
<script src="/transition.js?v=20260813-12"></script>

<script>
  const heroImages = ["hero1.webp","hero2.webp","hero3.webp"];
  const hero = document.getElementById("hero");

  function loadHero() {
    const img = heroImages[Math.floor(Math.random() * heroImages.length)];
    hero.style.backgroundImage = `url('${assetUrl(`assets/home/${img}`)}')`;
  }

  loadHero();

  document.getElementById("archive-button").onclick = () => toggleDarkMode();

  document.getElementById("skip-sound").onclick = () => skipTrack();

  resumeSoundIfNeeded();
</script>


</body>
</html>
