<script>
  window.ASSET_BASE = "https://pub-2469350b5b7041f197fdcd97ef5af87d.r2.dev";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return `${window.ASSET_BASE}/${u.replace(/^\/+/, "")}`;
  };
</script>

<script>
window.addEventListener("scroll", ()=>{
  const doc = document.documentElement;
  const bar = document.querySelector(".scroll-progress");
  if(!bar) return;
  const percent = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
  bar.style.width = percent + "%";
  bar.classList.toggle("visible", percent > 0);
});
</script>
