<!DOCTYPE html>

<script>
  window.ASSET_BASE = "https://mathismaar.b-cdn.net";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return window.ASSET_BASE + "/" + u.replace(/^\/+/, "");
  };

  var assetUrl = window.assetUrl;
</script>

  <meta charset="UTF-8">

</head>

<body data-page="work">
<script>if(localStorage.getItem("mm-dark-mode")==="1")document.body.classList.add("dark-mode");</script>

<div id="nav"></div>
<script>
  fetch("nav.html")
    .then(r => r.text())
    .then(d => {
      nav.innerHTML = d;

      const btn = nav.querySelector(".mobile-menu-toggle");
      const panel = nav.querySelector("#mobile-menu");
      if (!btn || !panel) return;

      function closeMenu() {
        btn.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
      }

      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        if (open) closeMenu();
        else {
          btn.setAttribute("aria-expanded", "true");
          panel.setAttribute("aria-hidden", "false");
          document.body.classList.add("menu-open");
        }
      });

      panel.addEventListener("click", (e) => {
        if (e.target && e.target.tagName === "A") closeMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    });
</script>


<div class="archive-button" id="archive-button"></div>
