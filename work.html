<!DOCTYPE html>
<html lang="en">
<head>
<script>
  window.ASSET_BASE = "https://mathismaar.b-cdn.net";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return window.ASSET_BASE + "/" + u.replace(/^\/+/, "");
  };

  var assetUrl = window.assetUrl;
</script>

  <meta charset="UTF-8">
  <title>Work</title>
  <link rel="stylesheet" href="global.css?v=20260112-2">
  <link rel="stylesheet" href="work.css">
</head>

<body data-page="work">

<div id="nav"></div>
<script>
  fetch("nav.html")
    .then(r => r.text())
    .then(d => {
      nav.innerHTML = d;

      const btn = nav.querySelector(".mobile-menu-toggle");
      const panel = nav.querySelector("#mobile-menu");
      if (!btn || !panel) return;

      function closeMenu() {
        btn.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
      }

      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        if (open) closeMenu();
        else {
          btn.setAttribute("aria-expanded", "true");
          panel.setAttribute("aria-hidden", "false");
          document.body.classList.add("menu-open");
        }
      });

      panel.addEventListener("click", (e) => {
        if (e.target && e.target.tagName === "A") closeMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    });
</script>


<div id="work-container"></div>

<script src="work.js"></script>
<script src="sound.js"></script>
<script src="transition.js"></script>
</body>
</html>
