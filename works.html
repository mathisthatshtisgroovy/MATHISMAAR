<!DOCTYPE html>
<html lang="en">
<head>

<script>
  window.ASSET_BASE = "https://mathismaar.b-cdn.net";
  window.assetUrl = function (u) {
    if (!u) return "";
    if (u.startsWith("http")) return u;
    return window.ASSET_BASE + "/" + u.replace(/^\/+/, "");
  };

  var assetUrl = window.assetUrl;
</script>

<meta charset="UTF-8">
<title>Selected Works – Mathis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="global.css?v=20260813-13">
<link rel="stylesheet" href="archive.css?v=20260813-13">
<link rel="stylesheet" href="works.css?v=20260813-13">
</head>

<body data-page="works">
<script>if(localStorage.getItem("mm-dark-mode")==="1")document.body.classList.add("dark-mode");</script>

<div id="nav"></div>
<script>
  fetch("nav.html")
    .then(r => r.text())
    .then(d => {
      nav.innerHTML = d;

      const btn = nav.querySelector(".mobile-menu-toggle");
      const panel = nav.querySelector("#mobile-menu");
      if (!btn || !panel) return;

      function closeMenu() {
        btn.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
      }

      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        if (open) closeMenu();
        else {
          btn.setAttribute("aria-expanded", "true");
          panel.setAttribute("aria-hidden", "false");
          document.body.classList.add("menu-open");
        }
      });

      panel.addEventListener("click", (e) => {
        if (e.target && e.target.tagName === "A") closeMenu();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    });
</script>

<div class="archive-button" id="archive-button"></div>
<div class="now-playing-wrap">
  <div id="skip-sound" class="skip-sound-btn"></div>
  <div id="now-playing" class="now-playing-text">Now Playing: —</div>
  <div id="skip-notice" class="skip-notice">skipped</div>
</div>

<main class="works-index" id="works-index"></main>

<script src="sound.js?v=20260813-13"></script>
<script src="transition.js?v=20260813-13"></script>
<script>
document.getElementById("archive-button").onclick = ()=> toggleDarkMode();
document.getElementById("skip-sound").onclick = ()=> skipTrack();
resumeSoundIfNeeded();
</script>

<script>
fetch("data/works.json")
  .then(r=>r.json())
  .then(projects=>{
    const list = document.getElementById("works-index");

    projects.sort((a,b)=>a.order-b.order).forEach((p,i)=>{
      const row = document.createElement("a");
      row.className = "work-row";
      row.href = `work.html#${p.id}`;

      row.innerHTML = `
        <span class="work-row-num">${String(i+1).padStart(2,"0")}</span>
        <span class="work-row-thumb"><img src="${assetUrl(p.hero)}" alt="" loading="lazy"></span>
        <span class="work-row-title">${p.title}</span>
        <span class="work-row-meta">
          <span class="work-row-type">${p.type || ""}</span>
          <span class="work-row-year">${p.year}</span>
        </span>
      `;

      list.appendChild(row);
    });
  });
</script>

</body>
</html>
